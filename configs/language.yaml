seed: 20250905
paths:
  project_root: .
  model: models/Qwen3.5-9B
  mapping: configs/scene_mappings.yaml
  train_annotations: annotations/train.json
  validation_annotations: annotations/validation.json
  test_annotations: annotations/test.json
  output_dir: outputs/language
model:
  architecture: qwen3_5
  model_class: Qwen3_5ForConditionalGeneration
  attention_backend: flash_attention_2
  linear_attention_backend: fla
  torch_dtype: bfloat16
  use_cache: false
  gradient_checkpointing: true
  use_kernels: false
lora:
  enabled: true
  target_modules:
  - q_proj
  - v_proj
  - in_proj_qkv
  target_scope: language_model.layers.*
  include_linear_attention: true
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
classifier:
  input_dim: 4096
  hidden_dim: 512
  dropout: 0.1
  activation: gelu
loss:
  answer_loss_weight: 1.0
  reason_loss_weight: 0.2
training:
  batch_size: 2
  gradient_accumulation_steps: 4
  effective_batch_size: 8
  evaluation_batch_size: 4
  num_workers: 0
  epochs: 3
  optimizer: adamw
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lora_learning_rate: 2.0e-05
  head_learning_rate: 0.0001
  lora_weight_decay: 0.0
  head_weight_decay: 0.01
  scheduler: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  validate_every_steps: 500
  save_every_steps: 500
  threshold: 0.5
  best_metric: validation_macro_f1
video:
  num_frames: 16
  sampling: uniform
  grid_rows: 7
  grid_cols: 7
  tile_size: 96
  mosaic_size:
  - 672
  - 672
  resize: preserve_aspect_ratio_with_black_padding
  processor_do_resize: false
  processor_do_sample_frames: false
  processor_cap_pixels_per_frame: false
input:
  use_reason_as_assistant_target: true
  use_reason_as_classifier_input: false
  use_answer_as_input: false
  use_capability_as_input: false
  use_evidence_time_ids_for_sampling: false
  enable_thinking: false
performance:
  cache_visual_features: true
  pin_memory: true
  prefetch_batches: 2
  reason_token_chunk: 64
prompt:
  template: 'You are given a multi-view video of a dynamic scene and an assertion
    about the scene.


    Determine whether the assertion is true or false based only on the visual evidence
    in the video, and explain the visual evidence supporting your judgment.


    Assertion:

    {assertion}'
